name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Tests boot the real API against a throwaway SQLite database with the mock
      # Google provider, so no credentials or network access to Google are needed.
      NODE_ENV: test
      GOOGLE_PROVIDER: mock
      EMAIL_TEST_MODE: 'true'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck server
        run: npx tsc -p server/tsconfig.json --noEmit

      - name: Typecheck web
        run: npx tsc -p web/tsconfig.json --noEmit

      - name: Test (API end-to-end + certificate geometry)
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert no secrets are tracked
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo "::error::.env is tracked — secrets must never be committed."
            exit 1
          fi
          if git ls-files | grep -Ei '(service-account|firebase-adminsdk)[^/]*\.json$' ; then
            echo "::error::A service-account key is tracked."
            exit 1
          fi
          if git grep -nIE 'BEGIN (RSA |EC )?PRIVATE KEY' -- . ':!package-lock.json' ; then
            echo "::error::A private key was found in the tree."
            exit 1
          fi
          echo "No secrets tracked."
