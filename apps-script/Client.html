<script>
/**
 * EMBEDX Client-Side Architecture & State Controller
 * Handles RPC invocations, reactive routing, modals, and toasts
 */

const App = {
  state: {
    user: null,
    dashboard: null,
    activeView: 'dashboard',
    activeQuiz: null,
    quizAttempt: null,
    answers: {},
    timeRemaining: 0,
    timerInterval: null,
    pollInterval: null
  },

  init() {
    this.renderHeader();
    this.loadUserData();
    this.setupEventListeners();
  },

  // =========================================================================
  // RPC DISPATCHER WITH LOCAL PREVIEW FALLBACK
  // =========================================================================

  call(methodName, ...args) {
    return new Promise((resolve, reject) => {
      // Check if google.script.run is available
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => {
            console.error('RPC Error [' + methodName + ']:', err);
            reject(err);
          })[methodName](...args);
      } else {
        // Mock fallback for offline or standalone browser review
        console.warn('google.script.run unavailable. Executing mock for:', methodName);
        setTimeout(() => {
          this.mockRpc(methodName, args).then(resolve).catch(reject);
        }, 300);
      }
    });
  },

  mockRpc(method, args) {
    if (method === 'rpcGetCurrentUser') {
      return Promise.resolve({
        email: '814725105014@trp.srmtrichy.edu.in',
        domainAuthorized: true,
        role: 'super_admin',
        isSuperAdmin: true,
        isAdmin: true,
        isStudent: false
      });
    }
    if (method === 'rpcGetStudentDashboard') {
      return Promise.resolve({
        profile: { id: 'STU-DEMO', displayName: 'HARIHARAN V', email: '814725105014@trp.srmtrichy.edu.in', department: 'EEE' },
        workshop: {
          title: 'Basics of Embedded Systems and Embedded Programming Language',
          date: '30 October 2026 (Friday)',
          venue: '5th Floor, CSE Seminar Hall'
        },
        sessions: [
          { id: 'session-1', order: 1, title: 'Fundamentals of embedded systems and their applications', phaseId: 'phase-1' },
          { id: 'session-2', order: 2, title: 'Microcontrollers, sensors, actuators, and hardware components', phaseId: 'phase-1' },
          { id: 'session-3', order: 3, title: 'Embedded C and introductory embedded programming', phaseId: 'phase-2' },
          { id: 'session-4', order: 4, title: 'Programming and interfacing input/output devices', phaseId: 'phase-2' },
          { id: 'session-5', order: 5, title: 'Basic hardware interfacing techniques using microcontrollers', phaseId: 'phase-2' }
        ],
        quizzes: [
          {
            id: 'QUIZ-EMB-01',
            sessionId: 'session-1',
            phaseId: 'phase-1',
            title: 'Quiz 1: Embedded Architecture Fundamentals',
            durationMinutes: 15,
            totalMarks: 10,
            attemptLimit: 2,
            attemptsUsed: 0,
            status: 'available',
            bestScore: null
          }
        ],
        phaseProgress: {
          phase1: { title: 'Phase 1: Foundations', completed: false, quizzesCompleted: 0, requiredQuizzes: 2, percentage: 0 },
          phase2: { title: 'Phase 2: Applied Firmware & Automation', completed: false, quizzesCompleted: 0, requiredQuizzes: 3, percentage: 0 }
        },
        certificate: { eligible: false, issued: false },
        rank: { rank: 1, totalScore: 0, totalContenders: 45 }
      });
    }
    if (method === 'rpcGetLeaderboard') {
      return Promise.resolve({
        generatedAt: '30 Oct 2026, 10:30',
        totalContenders: 3,
        leaderboard: [
          { rank: 1, displayName: 'HARIHARAN V', email: '8147****@trp.srmtrichy.edu.in', totalScore: 10, quizzesPassed: 1, department: 'EEE' },
          { rank: 2, displayName: 'RAMANATHAN S', email: '8147****@trp.srmtrichy.edu.in', totalScore: 8, quizzesPassed: 1, department: 'EEE' },
          { rank: 3, displayName: 'NANTHAKISHORE J', email: '8147****@trp.srmtrichy.edu.in', totalScore: 6, quizzesPassed: 1, department: 'EEE' }
        ]
      });
    }
    return Promise.resolve({ success: true });
  },

  // =========================================================================
  // VIEW NAVIGATION
  // =========================================================================

  navigate(viewName) {
    this.state.activeView = viewName;
    document.querySelectorAll('.view-panel').forEach(panel => {
      panel.style.display = 'none';
    });

    const activeEl = document.getElementById('view-' + viewName);
    if (activeEl) {
      activeEl.style.display = 'block';
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.view === viewName);
    });

    // Clear live monitoring poll if leaving admin results
    if (viewName !== 'admin-results' && this.state.pollInterval) {
      clearInterval(this.state.pollInterval);
      this.state.pollInterval = null;
    }

    // Trigger view-specific loads
    if (viewName === 'dashboard') this.loadDashboard();
    if (viewName === 'leaderboard') this.loadLeaderboard();
    if (viewName === 'admin-dashboard') this.loadAdminDashboard();
    if (viewName === 'admin-editor') this.loadAdminEditor();
    if (viewName === 'admin-results') this.loadAdminResults(true);
    if (viewName === 'admin-users') this.loadAdminUsers();
  },

  // =========================================================================
  // AUTH & USER DATA
  // =========================================================================

  async loadUserData() {
    try {
      const user = await this.call('rpcGetCurrentUser');
      this.state.user = user;
      this.renderHeader();

      if (!user.domainAuthorized && !user.isSuperAdmin) {
        this.showUnauthorizedScreen(user.email);
        return;
      }

      this.navigate('dashboard');
    } catch (err) {
      this.showToast('Authentication initialization failed: ' + err.message, 'error');
    }
  },

  renderHeader() {
    const user = this.state.user;
    const userBadgeEl = document.getElementById('headerUserBadge');
    const adminNavsEl = document.getElementById('headerAdminNavs');

    if (user && user.email) {
      const initial = (user.email.charAt(0) || 'U').toUpperCase();
      userBadgeEl.innerHTML = `
        <div class="user-badge">
          <div class="user-avatar">${initial}</div>
          <div class="user-details">
            <span class="user-name">${user.email.split('@')[0]}</span>
            <span class="user-role">${user.role.toUpperCase()}</span>
          </div>
        </div>
      `;

      if (user.isAdmin) {
        adminNavsEl.innerHTML = `
          <button class="nav-btn" data-view="admin-dashboard" onclick="App.navigate('admin-dashboard')">
            <i class="fa-solid fa-chart-pie"></i> Admin Stats
          </button>
          <button class="nav-btn" data-view="admin-editor" onclick="App.navigate('admin-editor')">
            <i class="fa-solid fa-pen-to-square"></i> Quizzes & Questions
          </button>
          <button class="nav-btn" data-view="admin-results" onclick="App.navigate('admin-results')">
            <i class="fa-solid fa-satellite-dish"></i> Live Monitoring
          </button>
          ${user.isSuperAdmin ? `
            <button class="nav-btn" data-view="admin-users" onclick="App.navigate('admin-users')">
              <i class="fa-solid fa-user-shield"></i> Admins <span class="nav-admin-badge">Super</span>
            </button>
          ` : ''}
        `;
      }
    }
  },

  showUnauthorizedScreen(email) {
    document.querySelectorAll('.view-panel').forEach(p => p.style.display = 'none');
    const unauthEl = document.getElementById('view-unauthorized');
    if (unauthEl) {
      unauthEl.style.display = 'block';
      const detailEl = document.getElementById('unauthorizedEmailDetail');
      if (detailEl) detailEl.textContent = email || 'Unknown / Not Logged In';
    }
  },

  // =========================================================================
  // DASHBOARD LOADER
  // =========================================================================

  async loadDashboard() {
    const container = document.getElementById('dashboardContent');
    container.innerHTML = '<div style="text-align:center; padding: 3rem;"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--accent-cyan);"></i><p style="margin-top:1rem; color:var(--text-muted);">Syncing with EMBEDX Engine...</p></div>';

    try {
      const data = await this.call('rpcGetStudentDashboard');
      this.state.dashboard = data;
      this.renderDashboard(data);
    } catch (err) {
      container.innerHTML = `<div class="tech-card" style="border-color:#EF4444; text-align:center;"><i class="fa-solid fa-triangle-exclamation fa-2x" style="color:#EF4444; margin-bottom:1rem;"></i><p>${err.message}</p></div>`;
    }
  },

  renderDashboard(data) {
    const container = document.getElementById('dashboardContent');
    const p1 = data.phaseProgress.phase1;
    const p2 = data.phaseProgress.phase2;

    container.innerHTML = `
      <!-- Hero Event Banner -->
      <div class="hero-banner">
        <div class="hero-tag"><i class="fa-solid fa-microchip"></i> Official Technical Workshop</div>
        <h1 class="hero-title">${data.workshop.title}</h1>
        <p class="hero-subtitle">Department of Electrical and Electronics Engineering &bull; EMBEDX Club</p>
        <div class="hero-meta">
          <div class="hero-meta-item"><i class="fa-solid fa-calendar-day"></i> <strong>${data.workshop.date}</strong></div>
          <div class="hero-meta-item"><i class="fa-solid fa-location-dot"></i> ${data.workshop.venue}</div>
          <div class="hero-meta-item"><i class="fa-solid fa-id-card"></i> Contender: <strong>${data.profile.displayName}</strong></div>
          <button class="btn btn-sm btn-outline" onclick="App.openNameModal()"><i class="fa-solid fa-pen"></i> Edit Certificate Name</button>
        </div>
      </div>

      <!-- Phase Progress Overview -->
      <div class="grid-2" style="margin-bottom: 2rem;">
        <div class="tech-card">
          <div class="tech-card-header">
            <h3 class="card-title">Phase 1: Foundations</h3>
            <span class="badge ${p1.completed ? 'badge-green' : 'badge-orange'}">
              ${p1.completed ? '<i class="fa-solid fa-circle-check"></i> Completed' : 'In Progress'}
            </span>
          </div>
          <p class="card-desc">Mastery of embedded architectures, sensors, actuators, and microcontroller internals.</p>
          <div class="progress-bar-wrapper">
            <div class="progress-labels">
              <span>Required Quizzes Passed</span>
              <span><strong>${p1.quizzesCompleted} / ${p1.requiredQuizzes}</strong></span>
            </div>
            <div class="progress-track">
              <div class="progress-fill fill-green" style="width: ${p1.percentage}%;"></div>
            </div>
          </div>
        </div>

        <div class="tech-card">
          <div class="tech-card-header">
            <h3 class="card-title">Phase 2: Applied Firmware</h3>
            <span class="badge ${p2.completed ? 'badge-green' : (p1.completed ? 'badge-cyan' : 'badge-muted')}">
              ${p2.completed ? '<i class="fa-solid fa-circle-check"></i> Completed' : (p1.completed ? 'Unlocked' : '<i class="fa-solid fa-lock"></i> Locked')}
            </span>
          </div>
          <p class="card-desc">Embedded C programming, serial protocols (UART/I2C/SPI), and automation control loops.</p>
          <div class="progress-bar-wrapper">
            <div class="progress-labels">
              <span>Required Quizzes Passed</span>
              <span><strong>${p2.quizzesCompleted} / ${p2.requiredQuizzes}</strong></span>
            </div>
            <div class="progress-track">
              <div class="progress-fill fill-cyan" style="width: ${p2.percentage}%;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Certificate Action Banner -->
      <div class="tech-card" style="margin-bottom: 2rem; border-color: ${p2.completed ? 'var(--green-light)' : 'var(--border-subtle)'}; background: ${p2.completed ? 'rgba(20, 107, 58, 0.15)' : 'var(--bg-card)'};">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h3 class="card-title" style="color: ${p2.completed ? '#4ADE80' : 'var(--text-white)'};">
              <i class="fa-solid fa-certificate"></i> Official Certificate of Completion
            </h3>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.25rem;">
              ${p2.completed
                ? (data.certificate.issued ? 'Certificate successfully generated and verified. Ready for download.' : 'Phase 2 requirements completed! Click below to generate your official PDF certificate.')
                : 'Certificate unlocks automatically once all Phase 1 and Phase 2 required quizzes are passed.'}
            </p>
          </div>
          <div>
            ${p2.completed ? (
              data.certificate.issued ? `
                <a href="${data.certificate.pdfUrl}" target="_blank" class="btn btn-green">
                  <i class="fa-solid fa-download"></i> Download Certificate PDF
                </a>
              ` : `
                <button class="btn btn-green" onclick="App.generateCertificate()">
                  <i class="fa-solid fa-bolt"></i> Generate Certificate
                </button>
              `
            ) : `
              <button class="btn btn-outline" disabled>
                <i class="fa-solid fa-lock"></i> Locked (Complete Phase 2)
              </button>
            `}
          </div>
        </div>
      </div>

      <!-- Workshop Quizzes Section -->
      <h2 style="font-family: var(--font-heading); font-size: 1.5rem; color: var(--text-white); margin-bottom: 1rem;">
        <i class="fa-solid fa-list-check" style="color: var(--accent-cyan);"></i> Workshop Sessions & Assessments
      </h2>

      <div class="grid-2">
        ${data.quizzes.map(q => `
          <div class="tech-card">
            <div class="tech-card-header">
              <div>
                <span class="badge ${q.phaseId === 'phase-1' ? 'badge-cyan' : 'badge-orange'}" style="margin-bottom: 0.5rem;">
                  ${q.phaseId === 'phase-1' ? 'Phase 1' : 'Phase 2'}
                </span>
                <h4 class="card-title" style="font-size: 1.15rem;">${q.title}</h4>
              </div>
              <span class="badge ${q.status === 'completed' ? 'badge-green' : (q.status === 'available' ? 'badge-cyan' : 'badge-muted')}">
                ${q.status.toUpperCase()}
              </span>
            </div>
            <p class="card-desc">${q.instructions || 'Technical assessment covering session learning objectives.'}</p>
            <div style="display: flex; gap: 1rem; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1.25rem;">
              <span><i class="fa-solid fa-clock"></i> ${q.durationMinutes} Mins</span>
              <span><i class="fa-solid fa-star"></i> ${q.totalMarks} Marks</span>
              <span><i class="fa-solid fa-rotate"></i> Attempts: ${q.attemptsUsed}/${q.attemptLimit}</span>
            </div>
            ${q.bestScore !== null ? `
              <div style="background: rgba(15, 35, 77, 0.8); padding: 0.6rem 0.9rem; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 0.85rem;">
                <strong>Best Score:</strong> ${q.bestScore} / ${q.totalMarks} (${q.percentage}%) &bull;
                <span style="color: ${q.passed ? '#4ADE80' : '#EF4444'}; font-weight: bold;">
                  ${q.passed ? 'PASSED' : 'NOT PASSED'}
                </span>
              </div>
            ` : ''}
            <div>
              ${q.status === 'available' ? `
                <button class="btn btn-primary" style="width: 100%;" onclick="App.startQuiz('${q.id}')">
                  <i class="fa-solid fa-play"></i> Start Assessment
                </button>
              ` : (q.status === 'completed' ? `
                <button class="btn btn-outline" style="width: 100%;" onclick="App.startQuiz('${q.id}')">
                  <i class="fa-solid fa-rotate-right"></i> Retake (Attempt ${q.attemptsUsed + 1}/${q.attemptLimit})
                </button>
              ` : `
                <button class="btn btn-outline" style="width: 100%;" disabled>
                  <i class="fa-solid fa-ban"></i> Max Attempts Reached
                </button>
              `)}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  },

  // =========================================================================
  // QUIZ ENGINE CONTROLLER
  // =========================================================================

  async startQuiz(quizId) {
    this.showToast('Preparing secure quiz session...', 'success');
    try {
      const data = await this.call('rpcGetQuizForStudent', quizId);
      this.state.activeQuiz = data;
      this.state.answers = {};
      this.state.timeRemaining = data.quiz.durationMinutes * 60;
      this.navigate('quiz-player');
      this.renderQuizPlayer(data);
      this.startQuizTimer();
    } catch (err) {
      this.showToast('Could not load quiz: ' + err.message, 'error');
    }
  },

  renderQuizPlayer(data) {
    const container = document.getElementById('quizPlayerContent');
    container.innerHTML = `
      <div class="tech-card" style="margin-bottom: 1.5rem; position: sticky; top: 75px; z-index: 50; background: rgba(8, 23, 56, 0.95); backdrop-filter: blur(12px);">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h2 class="card-title" style="font-size: 1.35rem;">${data.quiz.title}</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">${data.questions.length} Questions &bull; Total Marks: ${data.quiz.totalMarks}</p>
          </div>
          <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="font-family: var(--font-code); font-size: 1.25rem; font-weight: 700; color: #00D2FF; background: rgba(0, 210, 255, 0.1); padding: 0.4rem 0.8rem; border-radius: var(--radius-sm); border: 1px solid var(--border-focus);">
              <i class="fa-regular fa-clock"></i> <span id="quizTimerDisplay">--:--</span>
            </div>
            <button class="btn btn-green" onclick="App.confirmSubmitQuiz()">
              <i class="fa-solid fa-paper-plane"></i> Submit Answers
            </button>
          </div>
        </div>
      </div>

      <!-- Question List -->
      <form id="quizForm">
        ${data.questions.map((q, idx) => `
          <div class="tech-card" style="margin-bottom: 1.5rem;" id="q-card-${q.id}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
              <h4 style="font-size: 1.05rem; color: var(--text-white); line-height: 1.4;">
                <span style="color: var(--accent-cyan); font-family: var(--font-code); margin-right: 0.5rem;">[Q${idx + 1}]</span>
                ${q.text}
              </h4>
              <span class="badge badge-muted">${q.marks} Mark${q.marks > 1 ? 's' : ''}</span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.65rem;">
              ${q.options.map(opt => `
                <label style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: var(--radius-sm); background: rgba(15, 35, 77, 0.6); border: 1px solid var(--border-subtle); cursor: pointer; transition: all 0.2s ease;" class="option-label" onclick="App.selectOption('${q.id}', '${opt.key}')">
                  <input type="radio" name="answer_${q.id}" value="${opt.key}" style="accent-color: var(--accent-cyan);" onchange="App.selectOption('${q.id}', '${opt.key}')" />
                  <span style="font-family: var(--font-code); font-weight: bold; color: var(--accent-cyan);">${opt.key}.</span>
                  <span style="color: var(--text-primary); font-size: 0.92rem;">${opt.text}</span>
                </label>
              `).join('')}
            </div>
          </div>
        `).join('')}

        <div style="text-align: center; margin-top: 2rem;">
          <button type="button" class="btn btn-green" style="padding: 0.85rem 2.5rem; font-size: 1rem;" onclick="App.confirmSubmitQuiz()">
            <i class="fa-solid fa-circle-check"></i> Finalize & Submit Attempt
          </button>
        </div>
      </form>
    `;
  },

  selectOption(qId, optionKey) {
    this.state.answers[qId] = optionKey;
    const card = document.getElementById('q-card-' + qId);
    if (card) {
      card.querySelectorAll('.option-label').forEach(lbl => {
        lbl.style.borderColor = 'var(--border-subtle)';
        lbl.style.background = 'rgba(15, 35, 77, 0.6)';
      });
      const selectedRadio = card.querySelector(`input[value="${optionKey}"]`);
      if (selectedRadio) {
        selectedRadio.checked = true;
        const parent = selectedRadio.closest('.option-label');
        if (parent) {
          parent.style.borderColor = 'var(--accent-cyan)';
          parent.style.background = 'rgba(0, 210, 255, 0.12)';
        }
      }
    }
  },

  startQuizTimer() {
    if (this.state.timerInterval) clearInterval(this.state.timerInterval);
    const display = document.getElementById('quizTimerDisplay');

    this.state.timerInterval = setInterval(() => {
      this.state.timeRemaining--;
      if (this.state.timeRemaining <= 0) {
        clearInterval(this.state.timerInterval);
        this.showToast('Time expired! Submitting answers automatically...', 'error');
        this.executeQuizSubmit();
        return;
      }

      const minutes = Math.floor(this.state.timeRemaining / 60);
      const seconds = this.state.timeRemaining % 60;
      if (display) {
        display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        if (this.state.timeRemaining < 120) {
          display.style.color = '#EF4444';
        }
      }
    }, 1000);
  },

  confirmSubmitQuiz() {
    const answeredCount = Object.keys(this.state.answers).length;
    const totalCount = this.state.activeQuiz.questions.length;

    if (confirm(`You have answered ${answeredCount} of ${totalCount} questions.\nAre you ready to submit your attempt?`)) {
      this.executeQuizSubmit();
    }
  },

  async executeQuizSubmit() {
    if (this.state.timerInterval) clearInterval(this.state.timerInterval);
    this.showToast('Submitting and calculating score on secure server...', 'success');

    try {
      const payload = {
        attemptId: this.state.activeQuiz.attemptId,
        quizId: this.state.activeQuiz.quiz.id,
        answers: this.state.answers
      };

      const result = await this.call('rpcSubmitQuizAttempt', payload);
      this.renderQuizResultModal(result);
    } catch (err) {
      this.showToast('Submission failed: ' + err.message, 'error');
    }
  },

  renderQuizResultModal(res) {
    const modal = document.getElementById('appModal');
    const title = document.getElementById('modalTitle');
    const body = document.getElementById('modalBody');

    title.innerHTML = res.passed ? '<i class="fa-solid fa-trophy" style="color:#4ADE80;"></i> Quiz Passed!' : '<i class="fa-solid fa-flag" style="color:var(--accent-cyan);"></i> Attempt Evaluated';

    body.innerHTML = `
      <div style="text-align: center; padding: 1rem 0 1.5rem;">
        <div style="font-size: 3rem; font-family: var(--font-heading); font-weight: 700; color: ${res.passed ? '#4ADE80' : '#E2E8F0'};">
          ${res.score} / ${res.totalPossible}
        </div>
        <p style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 1rem;">Score: <strong>${res.percentage}%</strong></p>
        <span class="badge ${res.passed ? 'badge-green' : 'badge-orange'}" style="font-size: 0.9rem; padding: 0.4rem 1rem;">
          ${res.passed ? 'PASSED — PHASE PROGRESS UPDATED' : 'ATTEMPT RECORDED'}
        </span>
      </div>

      ${res.review ? `
        <h4 style="color: var(--accent-cyan); margin: 1.5rem 0 0.75rem;">Question Review</h4>
        <div style="max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem;">
          ${res.review.map(r => `
            <div style="background: rgba(15, 35, 77, 0.6); padding: 0.75rem; border-radius: var(--radius-sm); border-left: 3px solid ${r.isCorrect ? '#4ADE80' : '#EF4444'};">
              <p style="font-size: 0.88rem; color: #fff; margin-bottom: 0.35rem;">${r.questionText}</p>
              <div style="font-size: 0.8rem; color: var(--text-muted);">
                Your Answer: <strong style="color: ${r.isCorrect ? '#4ADE80' : '#EF4444'};">${r.selectedOption || 'None'}</strong> |
                Correct: <strong style="color: #4ADE80;">${r.correctOption}</strong>
              </div>
              ${r.explanation ? `<p style="font-size: 0.78rem; color: var(--accent-cyan); margin-top: 0.25rem;"><em>${r.explanation}</em></p>` : ''}
            </div>
          `).join('')}
        </div>
      ` : ''}

      <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: flex-end;">
        <button class="btn btn-primary" onclick="App.closeModal(); App.navigate('dashboard');">
          <i class="fa-solid fa-house"></i> Return to Dashboard
        </button>
      </div>
    `;

    this.openModal();
  },

  // =========================================================================
  // LEADERBOARD LOADER
  // =========================================================================

  async loadLeaderboard() {
    const container = document.getElementById('leaderboardContent');
    container.innerHTML = '<div style="text-align:center; padding: 3rem;"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--accent-cyan);"></i><p style="margin-top:1rem; color:var(--text-muted);">Calculating verified scores...</p></div>';

    try {
      const data = await this.call('rpcGetLeaderboard', 100);
      this.renderLeaderboard(data);
    } catch (err) {
      container.innerHTML = `<div class="tech-card" style="border-color:#EF4444;"><p>${err.message}</p></div>`;
    }
  },

  renderLeaderboard(data) {
    const container = document.getElementById('leaderboardContent');
    container.innerHTML = `
      <div class="tech-card" style="margin-bottom: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h2 class="card-title"><i class="fa-solid fa-ranking-star" style="color: #F47B20;"></i> Verified Contender Leaderboard</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Updated: ${data.generatedAt} &bull; Contenders: ${data.totalContenders}</p>
          </div>
          <button class="btn btn-sm btn-outline" onclick="App.loadLeaderboard()">
            <i class="fa-solid fa-rotate"></i> Refresh
          </button>
        </div>
      </div>

      <div class="table-container">
        <table class="tech-table">
          <thead>
            <tr>
              <th style="width: 80px;">Rank</th>
              <th>Student Name</th>
              <th>Email</th>
              <th>Department</th>
              <th>Quizzes Passed</th>
              <th style="text-align: right;">Total Points</th>
            </tr>
          </thead>
          <tbody>
            ${data.leaderboard.map(e => `
              <tr>
                <td>
                  ${e.rank === 1 ? '<span class="badge" style="background:#FFD700; color:#000;"><i class="fa-solid fa-medal"></i> 1</span>' :
                    (e.rank === 2 ? '<span class="badge" style="background:#C0C0C0; color:#000;"><i class="fa-solid fa-medal"></i> 2</span>' :
                    (e.rank === 3 ? '<span class="badge" style="background:#CD7F32; color:#000;"><i class="fa-solid fa-medal"></i> 3</span>' :
                    `<strong>#${e.rank}</strong>`))}
                </td>
                <td><strong>${e.displayName}</strong></td>
                <td style="font-family: var(--font-code); color: var(--text-muted);">${e.email}</td>
                <td>${e.department || 'EEE'}</td>
                <td><span class="badge badge-green">${e.quizzesPassed}</span></td>
                <td style="text-align: right; font-family: var(--font-code); font-weight: bold; font-size: 1.05rem; color: var(--accent-cyan);">${e.totalScore}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  },

  // =========================================================================
  // ADMIN DASHBOARD & LIVE MONITORING
  // =========================================================================

  async loadAdminDashboard() {
    const container = document.getElementById('adminDashboardContent');
    container.innerHTML = '<div style="text-align:center; padding: 3rem;"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--accent-cyan);"></i></div>';

    try {
      const metrics = await this.call('rpcGetAdminMetrics');
      container.innerHTML = `
        <div class="hero-banner" style="padding: 1.75rem;">
          <div class="hero-tag"><i class="fa-solid fa-shield-halved"></i> Administrator Command Center</div>
          <h1 class="hero-title" style="font-size: 1.8rem;">Real-Time Workshop Operations</h1>
          <p class="hero-subtitle">Monitoring SRM TRP EEE Workshop Submissions, Phase Completions & Certifications</p>
        </div>

        <div class="grid-4" style="margin-bottom: 2rem;">
          <div class="tech-card">
            <span class="badge badge-cyan" style="margin-bottom: 0.5rem;">Registration</span>
            <div style="font-size: 2.2rem; font-family: var(--font-heading); font-weight: 700; color: #fff;">${metrics.totalRegisteredStudents}</div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Registered Students (${metrics.activeStudentsCount} Active)</p>
          </div>

          <div class="tech-card">
            <span class="badge badge-green" style="margin-bottom: 0.5rem;">Submissions</span>
            <div style="font-size: 2.2rem; font-family: var(--font-heading); font-weight: 700; color: #4ADE80;">${metrics.completedAttempts}</div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Completed Quiz Attempts</p>
          </div>

          <div class="tech-card">
            <span class="badge badge-orange" style="margin-bottom: 0.5rem;">Phases</span>
            <div style="font-size: 2.2rem; font-family: var(--font-heading); font-weight: 700; color: #FF8F3D;">${metrics.phase1Completions} / ${metrics.phase2Completions}</div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Phase 1 / Phase 2 Completed</p>
          </div>

          <div class="tech-card">
            <span class="badge badge-cyan" style="margin-bottom: 0.5rem;">Certifications</span>
            <div style="font-size: 2.2rem; font-family: var(--font-heading); font-weight: 700; color: #00D2FF;">${metrics.certificatesIssued}</div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Official PDFs Issued</p>
          </div>
        </div>

        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <button class="btn btn-primary" onclick="App.navigate('admin-results')"><i class="fa-solid fa-satellite-dish"></i> Open Live Submissions Stream</button>
          <button class="btn btn-green" onclick="App.navigate('admin-editor')"><i class="fa-solid fa-file-import"></i> Create / Import Questions</button>
          <button class="btn btn-outline" onclick="App.initDb()"><i class="fa-solid fa-database"></i> Re-verify 13 Relational Sheets</button>
        </div>
      `;
    } catch (err) {
      container.innerHTML = `<div class="tech-card" style="border-color:#EF4444;"><p>${err.message}</p></div>`;
    }
  },

  async loadAdminResults(startPolling = false) {
    const container = document.getElementById('adminResultsContent');
    container.innerHTML = '<div style="text-align:center; padding: 2rem;"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--accent-cyan);"></i><p style="margin-top:0.5rem; color:var(--text-muted);">Streaming near-live attempts...</p></div>';

    const fetchResults = async () => {
      try {
        const subs = await this.call('rpcGetAdminSubmissions');
        this.renderAdminSubmissionsTable(subs);
      } catch (err) {
        container.innerHTML = `<div class="tech-card" style="border-color:#EF4444;"><p>${err.message}</p></div>`;
      }
    };

    await fetchResults();

    if (startPolling && !this.state.pollInterval) {
      this.state.pollInterval = setInterval(fetchResults, 10000); // Poll every 10s
    }
  },

  renderAdminSubmissionsTable(subs) {
    const container = document.getElementById('adminResultsContent');
    container.innerHTML = `
      <div class="tech-card" style="margin-bottom: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h2 class="card-title"><i class="fa-solid fa-satellite-dish" style="color:#00D2FF;"></i> Live Submissions Monitor</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Near-live polling (every 10s) &bull; ${subs.length} Total Submissions Recorded</p>
          </div>
          <button class="btn btn-sm btn-outline" onclick="App.loadAdminResults(false)"><i class="fa-solid fa-rotate"></i> Poll Now</button>
        </div>
      </div>

      <div class="table-container">
        <table class="tech-table">
          <thead>
            <tr>
              <th>Attempt ID</th>
              <th>Student</th>
              <th>Email</th>
              <th>Quiz ID</th>
              <th>Status</th>
              <th>Score</th>
              <th>Result</th>
              <th>Submitted At</th>
            </tr>
          </thead>
          <tbody>
            ${subs.map(s => `
              <tr>
                <td style="font-family: var(--font-code); font-size: 0.8rem;">${s.attemptId}</td>
                <td><strong>${s.studentName}</strong></td>
                <td style="font-family: var(--font-code); color: var(--text-muted); font-size: 0.85rem;">${s.studentEmail}</td>
                <td><span class="badge badge-muted">${s.quizId}</span></td>
                <td><span class="badge ${s.status === 'submitted' ? 'badge-green' : 'badge-orange'}">${s.status}</span></td>
                <td style="font-family: var(--font-code); font-weight: bold;">${s.score} / ${s.totalPossible}</td>
                <td><span class="badge ${s.passed ? 'badge-green' : 'badge-orange'}">${s.passed ? 'PASSED' : 'ATTEMPTED'}</span></td>
                <td style="font-size: 0.82rem; color: var(--text-muted);">${s.submittedAt}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  },

  // =========================================================================
  // ADMIN USERS (SUPER ADMIN DELEGATION)
  // =========================================================================

  async loadAdminUsers() {
    const container = document.getElementById('adminUsersContent');
    container.innerHTML = '<div style="text-align:center; padding: 2rem;"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--accent-cyan);"></i></div>';

    try {
      const data = await this.call('rpcGetAdminUsersList');
      container.innerHTML = `
        <div class="tech-card" style="margin-bottom: 1.5rem;">
          <h2 class="card-title"><i class="fa-solid fa-user-shield" style="color: var(--accent-orange);"></i> Super Admin Delegation Panel</h2>
          <p class="card-desc">Assign and manage administrative privileges for EMBEDX Executive Council and EEE Faculty.</p>
        </div>

        <div class="grid-2" style="margin-bottom: 2rem;">
          <!-- Role Assign Form -->
          <div class="tech-card">
            <h3 class="card-title" style="font-size: 1.2rem; margin-bottom: 1rem;">Assign Administrator Access</h3>

            <div class="form-group">
              <label class="form-label">Select Council / Faculty Leader (From Club Files)</label>
              <select id="leaderPresetSelect" class="form-select" onchange="App.onLeaderPresetSelect(this.value)">
                <option value="">-- Choose Council / Faculty Member --</option>
                ${data.leadershipPresets.map(p => `
                  <option value="${p.id}" data-name="${p.name}" data-role="${p.suggestedRole}" data-dept="${p.department}">
                    ${p.name} (${p.role} - ${p.department})
                  </option>
                `).join('')}
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="adminAssignName" class="form-input" placeholder="e.g. RAMANATHAN S" />
            </div>

            <div class="form-group">
              <label class="form-label">Institutional Email (@trp.srmtrichy.edu.in)</label>
              <input type="email" id="adminAssignEmail" class="form-input" placeholder="e.g. president@trp.srmtrichy.edu.in" />
            </div>

            <div class="form-group">
              <label class="form-label">Assigned Role</label>
              <select id="adminAssignRole" class="form-select">
                <option value="admin">Administrator (Quiz/Question/Results Access)</option>
                <option value="coordinator">Faculty Coordinator (Dr. R. Meenal)</option>
                <option value="hod">Head of Department (HOD EEE)</option>
                <option value="super_admin">Super Administrator</option>
                <option value="student">Revoke to Student</option>
              </select>
            </div>

            <button class="btn btn-green" style="width: 100%;" onclick="App.submitAssignRole()">
              <i class="fa-solid fa-user-plus"></i> Save Role Authorization
            </button>
          </div>

          <!-- Existing Admins List -->
          <div class="tech-card">
            <h3 class="card-title" style="font-size: 1.2rem; margin-bottom: 1rem;">Authorized Administrators</h3>
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
              ${data.adminUsers.map(u => `
                <div style="background: rgba(15, 35, 77, 0.6); padding: 0.85rem; border-radius: var(--radius-sm); border-left: 3px solid ${u.isSuperAdmin ? '#F47B20' : 'var(--accent-cyan)'}; display: flex; justify-content: space-between; align-items: center;">
                  <div>
                    <h4 style="color: #fff; font-size: 0.95rem;">${u.name || u.email}</h4>
                    <p style="font-size: 0.78rem; color: var(--text-muted); font-family: var(--font-code);">${u.email}</p>
                    <span style="font-size: 0.75rem; color: var(--text-dim);">${u.department || 'EEE'}</span>
                  </div>
                  <div>
                    <span class="badge ${u.isSuperAdmin ? 'badge-orange' : 'badge-cyan'}">${u.role.toUpperCase()}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    } catch (err) {
      container.innerHTML = `<div class="tech-card" style="border-color:#EF4444;"><p>${err.message}</p></div>`;
    }
  },

  onLeaderPresetSelect(id) {
    const sel = document.getElementById('leaderPresetSelect');
    const opt = sel.options[sel.selectedIndex];
    if (opt && opt.dataset.name) {
      document.getElementById('adminAssignName').value = opt.dataset.name;
      document.getElementById('adminAssignRole').value = opt.dataset.role || 'admin';
    }
  },

  async submitAssignRole() {
    const email = document.getElementById('adminAssignEmail').value.trim();
    const name = document.getElementById('adminAssignName').value.trim();
    const role = document.getElementById('adminAssignRole').value;

    if (!email) {
      alert('Please enter an institutional email address.');
      return;
    }

    try {
      this.showToast('Assigning role...', 'success');
      const res = await this.call('rpcAssignAdminRole', email, role, name, 'Department of EEE');
      this.showToast(res.message, 'success');
      this.loadAdminUsers();
    } catch (err) {
      this.showToast('Role assignment failed: ' + err.message, 'error');
    }
  },

  // =========================================================================
  // CERTIFICATE & PROFILE HELPERS
  // =========================================================================

  openNameModal() {
    const current = this.state.dashboard ? this.state.dashboard.profile.displayName : '';
    const modal = document.getElementById('appModal');
    const title = document.getElementById('modalTitle');
    const body = document.getElementById('modalBody');

    title.innerHTML = '<i class="fa-solid fa-pen-nib"></i> Edit Certificate Display Name';
    body.innerHTML = `
      <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem;">
        Please ensure your name is spelled exactly as you wish it to appear on your official SRM TRP Engineering College Certificate of Completion.
      </p>
      <div class="form-group">
        <label class="form-label">Full Name for Certificate</label>
        <input type="text" id="certNameInput" class="form-input" value="${current}" />
      </div>
      <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
        <button class="btn btn-outline" onclick="App.closeModal()">Cancel</button>
        <button class="btn btn-green" onclick="App.saveCertificateName()"><i class="fa-solid fa-save"></i> Save Display Name</button>
      </div>
    `;
    this.openModal();
  },

  async saveCertificateName() {
    const input = document.getElementById('certNameInput');
    const newName = input ? input.value.trim() : '';
    if (!newName) return;

    try {
      this.showToast('Updating certificate name...', 'success');
      const res = await this.call('rpcUpdateCertificateDisplayName', newName);
      this.showToast('Certificate name updated to: ' + res.displayName, 'success');
      this.closeModal();
      this.loadDashboard();
    } catch (err) {
      this.showToast(err.message, 'error');
    }
  },

  async generateCertificate() {
    if (!confirm('Generate your official Certificate of Completion now?')) return;
    this.showToast('Generating official certificate via Google Slides & Drive...', 'success');

    try {
      const res = await this.call('rpcGenerateCertificate');
      this.showToast('Certificate generated successfully!', 'success');
      this.loadDashboard();
    } catch (err) {
      this.showToast('Certificate generation failed: ' + err.message, 'error');
    }
  },

  async initDb() {
    if (!confirm('Verify and initialize database tables? (Safe & Idempotent)')) return;
    try {
      this.showToast('Initializing database...', 'success');
      const res = await this.call('rpcInitDatabase');
      this.showToast(res.message, 'success');
    } catch (err) {
      this.showToast(err.message, 'error');
    }
  },

  // =========================================================================
  // TOAST & MODAL UI
  // =========================================================================

  showToast(message, type = 'success') {
    const shelf = document.getElementById('toastShelf');
    if (!shelf) return;
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}" style="color:${type === 'success' ? '#4ADE80' : '#EF4444'};"></i> <span>${message}</span>`;
    shelf.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, 4500);
  },

  openModal() {
    const m = document.getElementById('appModal');
    if (m) m.classList.add('active');
  },

  closeModal() {
    const m = document.getElementById('appModal');
    if (m) m.classList.remove('active');
  },

  setupEventListeners() {
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') this.closeModal();
    });
  }
};

window.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
